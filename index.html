  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // All 9 Boards Dictionary
    const boards = {
      gemini: window.BOARD_DATA,
      gm: window.GM_BOARD_DATA,
      ai_expert: window.AI_EXPERT_BOARD_DATA,
      interactive_web: window.IW_BOARD_DATA,
      ai_sketch: window.AS_BOARD_DATA,
      text_to_slides: window.TS_BOARD_DATA,
      music_creation: window.MC_BOARD_DATA,
      notebooklm_projects: window.NP_BOARD_DATA,
      prompt_architecture: window.PA_BOARD_DATA
    };

    // Board Tab Definitions
    const boardTabs = [
      { key: 'gemini', icon: 'sparkles', label: 'Gemini就是神奇', color: 'indigo' },
      { key: 'gm', icon: 'book-open', label: '公明國中-Notebook', color: 'sky' },
      { key: 'ai_expert', icon: 'bot', label: 'AI專家系統建置', color: 'purple' },
      { key: 'interactive_web', icon: 'globe', label: '互動網頁實作', color: 'emerald' },
      { key: 'ai_sketch', icon: 'palette', label: 'AI素描課-圖片摹寫', color: 'amber' },
      { key: 'text_to_slides', icon: 'presentation', label: '文生簡報', color: 'rose' },
      { key: 'music_creation', icon: 'music', label: '歌曲創作', color: 'violet' },
      { key: 'notebooklm_projects', icon: 'file-text', label: 'NotebookLM教學專案', color: 'blue' },
      { key: 'prompt_architecture', icon: 'code', label: '提示詞架構練習', color: 'teal' }
    ];

    // State Variables
    let activeBoardKey = 'gemini';
    let currentView = 'board'; // 'board' | 'grid' | 'list'
    let currentFilter = 'all';  // 'all' | '資料' | '範例' | '工具' | '實作'
    let searchQuery = '';
    let currentModalCardIndex = 0;
    let visibleCards = [];

    // DOM Elements
    const appBody = document.getElementById('appBody');
    const tabsContainer = document.getElementById('tabsContainer');
    const globalStatsBadge = document.getElementById('globalStatsBadge');
    const boardIcon = document.getElementById('boardIcon');
    const boardTitle = document.getElementById('boardTitle');
    const legendContainer = document.getElementById('legendContainer');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const colorFiltersDesktop = document.getElementById('colorFiltersDesktop');
    const colorFiltersMobile = document.getElementById('colorFiltersMobile');
    const columnJumpSelect = document.getElementById('columnJumpSelect');
    const origPadletLink = document.getElementById('origPadletLink');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    // Views
    const boardView = document.getElementById('boardView');
    const gridView = document.getElementById('gridView');
    const listView = document.getElementById('listView');
    const gridCardsContainer = document.getElementById('gridCardsContainer');
    const listCardsContainer = document.getElementById('listCardsContainer');

    const viewBoardBtn = document.getElementById('viewBoardBtn');
    const viewGridBtn = document.getElementById('viewGridBtn');
    const viewListBtn = document.getElementById('viewListBtn');

    // Modal Elements
    const cardDetailModal = document.getElementById('cardDetailModal');
    const cardModalContent = document.getElementById('cardModalContent');
    const modalSectionName = document.getElementById('modalSectionName');
    const modalColorBadge = document.getElementById('modalColorBadge');
    const modalLinkTypeBadge = document.getElementById('modalLinkTypeBadge');
    const modalTitle = document.getElementById('modalTitle');
    const modalMediaContainer = document.getElementById('modalMediaContainer');
    const modalBodyContainer = document.getElementById('modalBodyContainer');
    const modalCommentsContainer = document.getElementById('modalCommentsContainer');
    const modalCommentsList = document.getElementById('modalCommentsList');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalPrevBtn = document.getElementById('modalPrevBtn');
    const modalNextBtn = document.getElementById('modalNextBtn');
    const copyPromptBtn = document.getElementById('copyPromptBtn');
    const downloadFileBtn = document.getElementById('downloadFileBtn');
    const externalLinkBtn = document.getElementById('externalLinkBtn');
    const externalLinkText = document.getElementById('externalLinkText');

    // Downloads Modal Elements
    const downloadsModal = document.getElementById('downloadsModal');
    const downloadsModalTitle = document.getElementById('downloadsModalTitle');
    const openDownloadsBtn = document.getElementById('openDownloadsBtn');
    const closeDownloadsModalBtn = document.getElementById('closeDownloadsModalBtn');
    const downloadsListContainer = document.getElementById('downloadsListContainer');
    const downloadsCount = document.getElementById('downloadsCount');
    const randomDrawBtn = document.getElementById('randomDrawBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');

    function getActiveBoard() {
      return boards[activeBoardKey] || boards.gemini;
    }

    // Initialize Top Navigation Tabs
    function initTabs() {
      tabsContainer.innerHTML = '';
      let totalAllCards = 0;

      boardTabs.forEach(t => {
        const b = boards[t.key];
        const count = b ? b.cards.length : 0;
        totalAllCards += count;

        const btn = document.createElement('button');
        btn.id = `tabBtn_${t.key}`;
        btn.dataset.board = t.key;
        btn.className = 'flex-none px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold flex items-center gap-1.5 transition-all text-slate-300 hover:text-white hover:bg-white/10 whitespace-nowrap cursor-pointer';
        btn.innerHTML = `
          <i data-lucide="${t.icon}" class="w-3.5 h-3.5"></i>
          <span>${t.label}</span>
          <span class="px-1.5 py-0.2 rounded-full text-[10px] bg-black/30 font-mono text-slate-300">${count}</span>
        `;

        btn.addEventListener('click', () => {
          switchBoard(t.key);
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        });

        tabsContainer.appendChild(btn);
      });

      globalStatsBadge.textContent = `9大看板 · ${totalAllCards.toLocaleString()}張卡片全量離線`;
    }

    // Switch Active Board
    function switchBoard(key) {
      if (!boards[key]) return;
      activeBoardKey = key;
      currentFilter = 'all';
      searchQuery = '';
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');

      const b = getActiveBoard();

      // Update Body Background Wallpaper
      if (b.wallpaper) {
        if (document.documentElement.classList.contains('dark')) {
          appBody.style.backgroundImage = `radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.78) 0%, rgba(8, 12, 24, 0.94) 100%), url("${b.wallpaper}")`;
        } else {
          appBody.style.backgroundImage = `radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.88) 0%, rgba(241, 245, 249, 0.96) 100%), url("${b.wallpaper}")`;
        }
      }

      // Update Top Tabs styling
      boardTabs.forEach(t => {
        const btn = document.getElementById(`tabBtn_${t.key}`);
        if (!btn) return;
        const isActive = t.key === key;
        if (isActive) {
          btn.className = `flex-none px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-bold flex items-center gap-1.5 transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/30 whitespace-nowrap`;
        } else {
          btn.className = `flex-none px-3 py-1.5 rounded-lg text-xs md:text-sm font-medium flex items-center gap-1.5 transition-all text-slate-300 hover:text-white hover:bg-white/10 whitespace-nowrap`;
        }
      });

      // Update Board Icon & Header
      boardTitle.textContent = b.title;
      origPadletLink.href = b.original_url || '#';

      renderLegend();
      renderFilterTabs();
      renderColumnJump();

      // Update Downloads Count
      const filesCount = b.cards.filter(c => c.local_file).length;
      downloadsCount.textContent = filesCount;
      downloadsModalTitle.textContent = `${b.title} - 本機素材庫 (${filesCount})`;

      refreshView();
      lucide.createIcons();
    }

    // Render Legend
    function renderLegend() {
      const dataLabel = (activeBoardKey === 'gemini') ? '紫標是資料' : '黃標是資料';
      const dataDot = (activeBoardKey === 'gemini') ? 'bg-purple-400' : 'bg-amber-400';

      legendContainer.innerHTML = `
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full ${dataDot}"></span>${dataLabel}</span>
        <span class="text-slate-500">•</span>
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-400"></span>紅標有範例</span>
        <span class="text-slate-500">•</span>
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-sky-400"></span>藍標歸工具</span>
        <span class="text-slate-500">•</span>
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>綠標要實作</span>
      `;
    }

    // Render Filter Tabs
    function renderFilterTabs() {
      const b = getActiveBoard();
      const cards = b.cards;
      
      const counts = { all: cards.length, data: 0, example: 0, tool: 0, practice: 0 };
      cards.forEach(c => {
        if (c.color_label === '資料') counts.data++;
        else if (c.color_label === '範例') counts.example++;
        else if (c.color_label === '工具') counts.tool++;
        else if (c.color_label === '實作') counts.practice++;
      });

      const colorDataName = (activeBoardKey === 'gemini') ? '紫標' : '黃標';
      const colorDataDot = (activeBoardKey === 'gemini') ? 'bg-purple-400' : 'bg-amber-400';

      colorFiltersDesktop.innerHTML = `
        <button data-filter="all" class="filter-btn active px-2.5 py-1 rounded-md font-medium transition-colors bg-white/20 text-white">全部 (${counts.all})</button>
        <button data-filter="資料" class="filter-btn px-2.5 py-1 rounded-md font-medium text-slate-300 hover:text-white transition-colors flex items-center gap-1"><span class="w-2 h-2 rounded-full ${colorDataDot}"></span>${colorDataName} (${counts.data})</button>
        <button data-filter="範例" class="filter-btn px-2.5 py-1 rounded-md font-medium text-slate-300 hover:text-white transition-colors flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-400"></span>紅標 (${counts.example})</button>
        <button data-filter="工具" class="filter-btn px-2.5 py-1 rounded-md font-medium text-slate-300 hover:text-white transition-colors flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-sky-400"></span>藍標 (${counts.tool})</button>
        <button data-filter="實作" class="filter-btn px-2.5 py-1 rounded-md font-medium text-slate-300 hover:text-white transition-colors flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>綠標 (${counts.practice})</button>
      `;

      colorFiltersMobile.innerHTML = `
        <div class="flex items-center gap-1.5 flex-none">
          <button data-filter="all" class="filter-btn active px-2 py-0.5 rounded-md bg-white/20 text-white">全部 (${counts.all})</button>
          <button data-filter="資料" class="filter-btn px-2 py-0.5 rounded-md text-slate-300">${colorDataName} (${counts.data})</button>
          <button data-filter="範例" class="filter-btn px-2 py-0.5 rounded-md text-slate-300">紅標 (${counts.example})</button>
          <button data-filter="工具" class="filter-btn px-2 py-0.5 rounded-md text-slate-300">藍標 (${counts.tool})</button>
          <button data-filter="實作" class="filter-btn px-2 py-0.5 rounded-md text-slate-300">綠標 (${counts.practice})</button>
        </div>
      `;

      // Filter click listeners
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('active', 'bg-white/20', 'text-white');
            b.classList.add('text-slate-300');
          });
          btn.classList.add('active', 'bg-white/20', 'text-white');
          btn.classList.remove('text-slate-300');

          currentFilter = btn.dataset.filter;
          refreshView();
        });
      });
    }

    // Get Active Shelves (Handles single-section boards by grouping into 4 color shelves for great layout)
    function getBoardShelves(b) {
      if (b.sections && b.sections.length > 1) {
        return b.sections;
      }
      // For single-section boards, split into 4 logical color shelves
      const colorGroups = [
        { id: `${b.key || 'sec'}-color-data`, title: '📖 資料與說明', filterColor: '資料' },
        { id: `${b.key || 'sec'}-color-example`, title: '💡 範例與案例', filterColor: '範例' },
        { id: `${b.key || 'sec'}-color-tool`, title: '🛠️ 工具與平台', filterColor: '工具' },
        { id: `${b.key || 'sec'}-color-practice`, title: '🚀 實作與成果', filterColor: '實作' }
      ];

      return colorGroups.map(g => {
        const secCards = b.cards.filter(c => c.color_label === g.filterColor);
        return {
          id: g.id,
          title: g.title,
          cards_count: secCards.length,
          cards: secCards
        };
      }).filter(s => s.cards.length > 0);
    }

    // Render Column Jump
    function renderColumnJump() {
      const b = getActiveBoard();
      const shelves = getBoardShelves(b);
      columnJumpSelect.innerHTML = `<option value="">跳轉分欄 (${shelves.length})...</option>`;
      shelves.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.title} (${s.cards_count || s.cards.length})`;
        columnJumpSelect.appendChild(opt);
      });
    }

    // Filter Matching
    function matchesFilter(card) {
      if (currentFilter === 'all') return true;
      return card.color_label === currentFilter;
    }

    function matchesSearch(card) {
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      const inTitle = (card.title || '').toLowerCase().includes(q);
      const inBody = (card.body || '').toLowerCase().includes(q);
      const inSection = (card.section_title || '').toLowerCase().includes(q);
      const inComments = (card.comments || []).some(c => (c.body || '').toLowerCase().includes(q));
      return inTitle || inBody || inSection || inComments;
    }

    function highlightText(text) {
      if (!searchQuery || !text) return text;
      const regex = new RegExp(`(${searchQuery.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
      return text.replace(regex, '<mark>$1</mark>');
    }

    // Toast
    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    // Copy Text
    function copyText(str, msg = '提示詞已成功複製至剪貼簿！') {
      navigator.clipboard.writeText(str).then(() => {
        showToast(msg);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = str;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(msg);
      });
    }

    // Card Element Builder
    function createCardElement(card) {
      const cardEl = document.createElement('div');
      cardEl.className = 'card-transition bg-slate-900/85 dark:bg-slate-900/90 border border-white/10 hover:border-indigo-400/50 rounded-xl p-3.5 shadow-md flex flex-col gap-2.5 cursor-pointer backdrop-blur-sm';
      cardEl.dataset.id = card.id;

      let badgeClass = card.badge_class || 'bg-slate-800 text-slate-300 border-slate-700';

      const headerRow = `
        <div class="flex items-center justify-between gap-2">
          <span class="px-2 py-0.5 rounded text-[11px] font-semibold border ${badgeClass}">
            ${card.color_label || '一般'}
          </span>
          <div class="flex items-center gap-1">
            ${card.is_video ? '<span class="px-1.5 py-0.5 rounded text-[10px] bg-red-500/20 text-red-300 border border-red-500/30 font-medium flex items-center gap-1"><i data-lucide="video" class="w-3 h-3"></i> 影片</span>' : ''}
            ${card.is_pdf ? '<span class="px-1.5 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 font-medium flex items-center gap-1"><i data-lucide="file-text" class="w-3 h-3"></i> PDF</span>' : ''}
            ${card.is_pptx ? '<span class="px-1.5 py-0.5 rounded text-[10px] bg-orange-500/20 text-orange-300 border border-orange-500/30 font-medium flex items-center gap-1"><i data-lucide="presentation" class="w-3 h-3"></i> PPTX</span>' : ''}
            ${card.link_type === 'gem' ? '<span class="px-1.5 py-0.5 rounded text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-medium flex items-center gap-1"><i data-lucide="bot" class="w-3 h-3"></i> Gem</span>' : ''}
            ${card.link_type === 'notebook' ? '<span class="px-1.5 py-0.5 rounded text-[10px] bg-sky-500/20 text-sky-300 border border-sky-500/30 font-medium flex items-center gap-1"><i data-lucide="book-open" class="w-3 h-3"></i> NBLM</span>' : ''}
            ${card.link_type === 'music' ? '<span class="px-1.5 py-0.5 rounded text-[10px] bg-violet-500/20 text-violet-300 border border-violet-500/30 font-medium flex items-center gap-1"><i data-lucide="music" class="w-3 h-3"></i> 音樂</span>' : ''}
          </div>
        </div>
      `;

      let mediaHtml = '';
      if (card.is_video && card.local_file) {
        mediaHtml = `
          <div class="rounded-lg overflow-hidden bg-black/60 aspect-video relative flex items-center justify-center">
            <video src="${card.local_file}" preload="metadata" class="w-full h-full object-cover" onclick="event.stopPropagation()"></video>
            <div class="absolute inset-0 bg-black/30 flex items-center justify-center pointer-events-none">
              <i data-lucide="play-circle" class="w-10 h-10 text-white/90"></i>
            </div>
          </div>
        `;
      } else if (card.local_image) {
        mediaHtml = `
          <div class="rounded-lg overflow-hidden bg-black/40 aspect-video relative flex items-center justify-center border border-white/5">
            <img src="${card.local_image}" alt="${card.title}" loading="lazy" class="w-full h-full object-cover">
          </div>
        `;
      }

      const titleHtml = `<h4 class="text-sm font-bold text-white tracking-tight leading-snug">${highlightText(card.title)}</h4>`;
      
      let bodySnippet = '';
      if (card.body) {
        bodySnippet = `<p class="text-xs text-slate-300 line-clamp-4 leading-relaxed">${highlightText(card.body)}</p>`;
      }

      let commentsBadge = '';
      if (card.comments && card.comments.length > 0) {
        commentsBadge = `
          <div class="pt-1 border-t border-white/5 flex items-center justify-between text-[11px] text-purple-300">
            <span class="flex items-center gap-1"><i data-lucide="message-square-code" class="w-3.5 h-3.5"></i> ${card.comments.length} 則提示詞/備註</span>
            <span class="text-[10px] text-slate-400">點擊查看</span>
          </div>
        `;
      }

      cardEl.innerHTML = headerRow + mediaHtml + titleHtml + bodySnippet + commentsBadge;
      cardEl.addEventListener('click', () => openModal(card));

      return cardEl;
    }

    // Render Board View (Shelves)
    function renderBoardView() {
      boardView.innerHTML = '';
      const b = getActiveBoard();
      const shelves = getBoardShelves(b);

      shelves.forEach(sec => {
        const secCards = sec.cards.filter(c => matchesFilter(c) && matchesSearch(c));
        
        const shelf = document.createElement('div');
        shelf.id = sec.id;
        shelf.className = 'w-72 sm:w-80 flex-none flex flex-col bg-slate-950/70 border border-white/10 rounded-2xl overflow-hidden backdrop-blur-md max-h-full shadow-xl';

        const header = document.createElement('div');
        header.className = 'p-3.5 border-b border-white/10 bg-slate-900/80 flex items-center justify-between sticky top-0 z-10';
        header.innerHTML = `
          <div class="flex items-center gap-2">
            <h3 class="font-bold text-sm text-white tracking-tight truncate">${sec.title}</h3>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-white/10 text-slate-300">${secCards.length}</span>
          </div>
        `;
        shelf.appendChild(header);

        const cardsList = document.createElement('div');
        cardsList.className = 'p-3 overflow-y-auto flex-1 space-y-3';

        if (secCards.length === 0) {
          cardsList.innerHTML = `<div class="p-6 text-center text-xs text-slate-500">無符合條件卡片</div>`;
        } else {
          secCards.forEach(c => {
            cardsList.appendChild(createCardElement(c));
          });
        }

        shelf.appendChild(cardsList);
        boardView.appendChild(shelf);
      });
      lucide.createIcons();
    }

    // Render Grid View
    function renderGridView() {
      gridCardsContainer.innerHTML = '';
      const b = getActiveBoard();
      const filtered = b.cards.filter(c => matchesFilter(c) && matchesSearch(c));
      if (filtered.length === 0) {
        gridCardsContainer.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm">無符合搜尋或篩選條件的卡片</div>`;
        return;
      }
      filtered.forEach(c => {
        gridCardsContainer.appendChild(createCardElement(c));
      });
      lucide.createIcons();
    }

    // Render List View
    function renderListView() {
      listCardsContainer.innerHTML = '';
      const b = getActiveBoard();
      const filtered = b.cards.filter(c => matchesFilter(c) && matchesSearch(c));

      if (filtered.length === 0) {
        listCardsContainer.innerHTML = `<div class="py-12 text-center text-slate-400 text-sm">無符合搜尋或篩選條件的卡片</div>`;
        return;
      }

      filtered.forEach((c, idx) => {
        const row = document.createElement('div');
        row.className = 'p-3 bg-slate-900/80 hover:bg-slate-800/80 border border-white/10 rounded-xl flex items-center justify-between gap-3 cursor-pointer transition-all';
        row.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <span class="w-6 text-center text-xs text-slate-500 font-mono flex-none">${idx + 1}</span>
            <span class="px-2 py-0.5 rounded text-[11px] font-semibold border ${c.badge_class || 'bg-slate-800 text-slate-300'} flex-none">
              ${c.color_label || '一般'}
            </span>
            <div class="min-w-0">
              <h4 class="text-sm font-bold text-white truncate">${highlightText(c.title)}</h4>
              <p class="text-xs text-slate-400 truncate">${c.section_title} ${c.body ? '• ' + c.body : ''}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-none">
            ${c.local_file ? '<span class="text-[10px] text-sky-400 flex items-center gap-1"><i data-lucide="download" class="w-3 h-3"></i> 附件</span>' : ''}
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
          </div>
        `;
        row.addEventListener('click', () => openModal(c));
        listCardsContainer.appendChild(row);
      });
      lucide.createIcons();
    }

    // Refresh Current View
    function refreshView() {
      const b = getActiveBoard();
      visibleCards = b.cards.filter(c => matchesFilter(c) && matchesSearch(c));

      if (currentView === 'board') renderBoardView();
      else if (currentView === 'grid') renderGridView();
      else if (currentView === 'list') renderListView();
    }

    // Set Active View
    function setView(view) {
      currentView = view;
      boardView.classList.toggle('hidden', view !== 'board');
      gridView.classList.toggle('hidden', view !== 'grid');
      listView.classList.toggle('hidden', view !== 'list');

      viewBoardBtn.classList.toggle('bg-white/20', view === 'board');
      viewBoardBtn.classList.toggle('text-white', view === 'board');
      viewBoardBtn.classList.toggle('text-slate-400', view !== 'board');

      viewGridBtn.classList.toggle('bg-white/20', view === 'grid');
      viewGridBtn.classList.toggle('text-white', view === 'grid');
      viewGridBtn.classList.toggle('text-slate-400', view !== 'grid');

      viewListBtn.classList.toggle('bg-white/20', view === 'list');
      viewListBtn.classList.toggle('text-white', view === 'list');
      viewListBtn.classList.toggle('text-slate-400', view !== 'list');

      refreshView();
    }

    // Open Modal
    function openModal(card) {
      currentModalCardIndex = visibleCards.findIndex(c => c.id === card.id);
      if (currentModalCardIndex === -1) currentModalCardIndex = 0;

      modalSectionName.textContent = card.section_title;
      modalColorBadge.textContent = card.color_label || '一般';
      modalColorBadge.className = `px-2.5 py-0.5 rounded-md text-xs font-semibold border ${card.badge_class || 'bg-slate-800 text-slate-300 border-slate-700'}`;

      if (card.link_type && card.link_label) {
        modalLinkTypeBadge.textContent = card.link_label;
        modalLinkTypeBadge.classList.remove('hidden');
      } else {
        modalLinkTypeBadge.classList.add('hidden');
      }

      modalTitle.textContent = card.title;
      modalBodyContainer.textContent = card.body || '（本卡片無額外文字說明）';

      // Media Preview
      if (card.is_video && card.local_file) {
        modalMediaContainer.innerHTML = `<video src="${card.local_file}" controls autoplay class="w-full max-h-96 object-contain"></video>`;
        modalMediaContainer.classList.remove('hidden');
      } else if (card.local_image) {
        modalMediaContainer.innerHTML = `<img src="${card.local_image}" alt="${card.title}" class="w-full max-h-96 object-contain">`;
        modalMediaContainer.classList.remove('hidden');
      } else {
        modalMediaContainer.classList.add('hidden');
      }

      // Comments & Prompts
      if (card.comments && card.comments.length > 0) {
        modalCommentsList.innerHTML = '';
        card.comments.forEach(c => {
          const item = document.createElement('div');
          item.className = 'p-3 bg-black/40 rounded-lg border border-purple-500/20 flex flex-col gap-2';
          item.innerHTML = `
            <div class="text-xs text-purple-200 leading-relaxed font-mono whitespace-pre-wrap">${c.body}</div>
            <div class="flex justify-end">
              <button class="px-2.5 py-1 bg-purple-600 hover:bg-purple-500 text-white rounded text-[11px] font-semibold flex items-center gap-1 transition-all">
                <i data-lucide="copy" class="w-3 h-3"></i> 複製此段指令
              </button>
            </div>
          `;
          item.querySelector('button').addEventListener('click', () => {
            copyText(c.body, '指令提示詞已複製！');
          });
          modalCommentsList.appendChild(item);
        });
        modalCommentsContainer.classList.remove('hidden');
      } else {
        modalCommentsContainer.classList.add('hidden');
      }

      // Footer Actions
      copyPromptBtn.onclick = () => {
        let fullText = card.title + '\n\n' + card.body;
        if (card.comments && card.comments.length > 0) {
          fullText += '\n\n【提示詞/指引】\n' + card.comments.map(c => c.body).join('\n\n');
        }
        copyText(fullText, '卡片完整內容已複製至剪貼簿！');
      };

      if (card.local_file) {
        downloadFileBtn.classList.remove('hidden');
        downloadFileBtn.classList.add('flex');
        downloadFileBtn.onclick = () => {
          const a = document.createElement('a');
          a.href = card.local_file;
          a.download = card.local_file.split('/').pop();
          a.click();
        };
      } else {
        downloadFileBtn.classList.add('hidden');
        downloadFileBtn.classList.remove('flex');
      }

      if (card.link) {
        externalLinkBtn.href = card.link;
        externalLinkText.textContent = `前往 ${card.link_label || '相關連結'}`;
        externalLinkBtn.classList.remove('hidden');
        externalLinkBtn.classList.add('flex');
      } else {
        externalLinkBtn.classList.add('hidden');
        externalLinkBtn.classList.remove('flex');
      }

      cardDetailModal.classList.remove('hidden');
      setTimeout(() => {
        cardDetailModal.classList.remove('opacity-0');
        cardModalContent.classList.remove('scale-95');
      }, 10);
      lucide.createIcons();
    }

    function closeModal() {
      cardDetailModal.classList.add('opacity-0');
      cardModalContent.classList.add('scale-95');
      setTimeout(() => {
        cardDetailModal.classList.add('hidden');
        modalMediaContainer.innerHTML = '';
      }, 200);
    }

    modalPrevBtn.addEventListener('click', () => {
      if (visibleCards.length === 0) return;
      currentModalCardIndex = (currentModalCardIndex - 1 + visibleCards.length) % visibleCards.length;
      openModal(visibleCards[currentModalCardIndex]);
    });

    modalNextBtn.addEventListener('click', () => {
      if (visibleCards.length === 0) return;
      currentModalCardIndex = (currentModalCardIndex + 1) % visibleCards.length;
      openModal(visibleCards[currentModalCardIndex]);
    });

    modalCloseBtn.addEventListener('click', closeModal);
    cardDetailModal.addEventListener('click', (e) => {
      if (e.target === cardDetailModal) closeModal();
    });

    // Downloads Modal
    function openDownloads() {
      downloadsListContainer.innerHTML = '';
      const b = getActiveBoard();
      const filesWithCards = b.cards.filter(c => c.local_file);
      downloadsCount.textContent = filesWithCards.length;

      if (filesWithCards.length === 0) {
        downloadsListContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">本看板暫無本機獨立檔案，所有內容皆為線上雲端互動教材。</div>`;
      } else {
        filesWithCards.forEach(c => {
          const item = document.createElement('div');
          item.className = 'p-3 bg-slate-950/60 rounded-xl border border-white/10 flex items-center justify-between gap-3 hover:border-sky-400/50 transition-all';
          item.innerHTML = `
            <div class="min-w-0">
              <h5 class="font-bold text-white truncate text-xs">${c.title}</h5>
              <p class="text-[11px] text-slate-400 truncate">${c.local_file.split('/').pop()}</p>
            </div>
            <a href="${c.local_file}" download class="px-2.5 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg font-semibold flex items-center gap-1 flex-none transition-colors text-xs">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> 下載
            </a>
          `;
          downloadsListContainer.appendChild(item);
        });
      }

      downloadsModal.classList.remove('hidden');
      setTimeout(() => {
        downloadsModal.classList.remove('opacity-0');
        downloadsModal.querySelector('div').classList.remove('scale-95');
      }, 10);
      lucide.createIcons();
    }

    function closeDownloads() {
      downloadsModal.classList.add('opacity-0');
      downloadsModal.querySelector('div').classList.add('scale-95');
      setTimeout(() => {
        downloadsModal.classList.add('hidden');
      }, 200);
    }

    openDownloadsBtn.addEventListener('click', openDownloads);
    closeDownloadsModalBtn.addEventListener('click', closeDownloads);
    downloadsModal.addEventListener('click', (e) => {
      if (e.target === downloadsModal) closeDownloads();
    });

    // Random Draw
    randomDrawBtn.addEventListener('click', () => {
      if (visibleCards.length === 0) return;
      const randIdx = Math.floor(Math.random() * visibleCards.length);
      openModal(visibleCards[randIdx]);
      showToast('🎲 已隨機為您抽出一張卡片！');
    });

    // CSV Export
    exportCsvBtn.addEventListener('click', () => {
      const b = getActiveBoard();
      let csv = '\uFEFF'; // UTF-8 BOM
      csv += '卡片編號,分欄主題,顏色分類,標題,主要內容,提示詞指引,附件連結,本機檔案\n';
      
      b.cards.forEach((c, idx) => {
        const row = [
          idx + 1,
          `"${(c.section_title || '').replace(/"/g, '""')}"`,
          `"${(c.color_label || '').replace(/"/g, '""')}"`,
          `"${(c.title || '').replace(/"/g, '""')}"`,
          `"${(c.body || '').replace(/"/g, '""')}"`,
          `"${(c.comments || []).map(cm => cm.body).join(' | ').replace(/"/g, '""')}"`,
          `"${(c.link || '').replace(/"/g, '""')}"`,
          `"${(c.local_file || '').replace(/"/g, '""')}"`
        ];
        csv += row.join(',') + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${b.title}_資料匯出_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('📊 已成功匯出 Excel 相容 CSV 報表！');
    });

    // Search Input
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearSearchBtn.classList.toggle('hidden', !searchQuery);
      refreshView();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      refreshView();
    });

    // Column Jump
    columnJumpSelect.addEventListener('change', (e) => {
      const targetId = e.target.value;
      if (!targetId) return;
      if (currentView !== 'board') setView('board');
      setTimeout(() => {
        const el = document.getElementById(targetId);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', inline: 'start' });
          el.classList.add('ring-2', 'ring-purple-400');
          setTimeout(() => el.classList.remove('ring-2', 'ring-purple-400'), 1500);
        }
      }, 50);
    });

    // View Switcher Buttons
    viewBoardBtn.addEventListener('click', () => setView('board'));
    viewGridBtn.addEventListener('click', () => setView('grid'));
    viewListBtn.addEventListener('click', () => setView('list'));

    // Theme Toggle
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      switchBoard(activeBoardKey);
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape') {
        closeModal();
        closeDownloads();
      } else if (!cardDetailModal.classList.contains('hidden')) {
        if (e.key === 'ArrowLeft') modalPrevBtn.click();
        else if (e.key === 'ArrowRight') modalNextBtn.click();
      }
    });

    // Boot
    initTabs();
    switchBoard('gemini');
    setView('board');
  </script>
</body>
</html>
